limit_req_zone $binary_remote_addr zone=mcp:10m rate=10r/s;

server {
    server_name camouf.ru;

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;

    proxy_redirect ~^(http://[^:]+):\d+(/.+)$ $1$2;
    proxy_redirect ~^(https://[^:]+):\d+(/.+)$ $1$2;

    set $docroot "/home/bitrix/ext_www/camouf.ru";

    index index.php;
    root "/home/bitrix/ext_www/camouf.ru";

    # MCP endpoints
    location /health {
        proxy_pass http://127.0.0.1:3100;
        proxy_buffering off;
        proxy_cache off;
    }

    location /mcp/ {
        rewrite ^/mcp(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
        limit_req zone=mcp burst=20 nodelay;
    }

    location /embed/ {
        rewrite ^/embed(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    include conf.d/bx_temp.conf;
    include conf.d/bitrix.conf;

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/camouf.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/camouf.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = camouf.ru) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name camouf.ru;
    return 404;
}

# ===== MCP-сервер (bxmcp.camouf.ru) =====
server {
    listen 443 ssl;
    server_name bxmcp.camouf.ru;

    ssl_certificate /etc/letsencrypt/live/bxmcp.camouf.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bxmcp.camouf.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
        limit_req zone=mcp burst=20 nodelay;
    }

    location /embed/ {
        rewrite ^/embed(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name bxmcp.camouf.ru;
    return 301 https://$server_name$request_uri;
}
