upstream apache {
    server 127.0.0.1:8090;
}

server {
    listen 80;
    server_name camouf.ru www.camouf.ru;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name camouf.ru www.camouf.ru;

    ssl_certificate /etc/letsencrypt/live/camouf.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/camouf.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /home/bitrix/ext_www/camouf.ru;                                                       

    location ~* ^/bitrix/cache/ {
        expires 30d;
        try_files $uri =404;
    }

    location = /mcp-usage {
        proxy_pass http://127.0.0.1:3100/admin/usage;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store";
    }

    location = /mcp-stats {
        proxy_pass http://127.0.0.1:3100/admin/stats?format=json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store";
    }

    location / {
        proxy_pass http://apache;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header HTTPS YES;
    }
}

server {
    listen 80;
    server_name bxmcp.camouf.ru;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bxmcp.camouf.ru;

    ssl_certificate /etc/letsencrypt/live/bxmcp.camouf.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bxmcp.camouf.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }

    location /embed/ {
        rewrite ^/embed(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
}
