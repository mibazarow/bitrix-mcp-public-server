# ===== MCP-сервер (bxmcp.example.com) =====
server {
    listen 443 ssl;
    server_name bxmcp.example.com;

    ssl_certificate /etc/letsencrypt/live/bxmcp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bxmcp.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
    }

    location /embed/ {
        rewrite ^/embed(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
}

